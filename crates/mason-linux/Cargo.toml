[package]
name = "mason-linux"
version = "0.1.0"
edition = "2021"

[lib]
name = "masonkit"
crate-type = ["cdylib"]

[dependencies]
mason-c = { path = "../mason-c" }
mason-core = { path = "../mason-core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_6"] }
pango = { version = "0.22", features = ["v1_50"] }
serde_json = "1"
libc = "0.2"
