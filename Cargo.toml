[workspace]
members = ["crates/mason-core", "crates/mason-android", "crates/mason-ios", "crates/mason-playground", "crates/mason-c", "crates/mason-windows"]
resolver = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
debug = false
incremental = false
strip = true
debug-assertions = false
overflow-checks = false

[workspace.dependencies]
# Our fork's `mason-fixes-v2` branch: taffy 0.14 plus flexbox and out-of-flow
# sizing fixes not yet upstream.
taffy = { git = "https://github.com/triniwiz/taffy.git", rev = "a1c9b917" }
style_atoms = { git = "https://github.com/servo/stylo", rev = "85ae0b1", package = "stylo_atoms" }
