dependencies {
  implementation 'com.google.code.gson:gson:2.10'
  implementation 'com.github.bumptech.glide:glide:4.14.2'
  annotationProcessor 'com.github.bumptech.glide:compiler:4.14.2'
  // fontmanager comes from the app's @nativescript/font-manager plugin, which
  // bundles a locally-built fontmanager.aar (feat/android-perf). Declaring the
  // Maven artifact here too duplicates every fontmanager class at dex merge.
  // implementation 'org.nativescript:fontmanager:1.0.8'
}

android {
  defaultConfig {
    multiDexEnabled true
  }      
      packagingOptions {
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'

         pickFirst 'lib/armeabi-v7a/libNativeScript.so'
        pickFirst 'lib/arm64-v8a/libNativeScript.so'
        pickFirst 'lib/x86_64/libNativeScript.so'
        pickFirst 'lib/x86/libNativeScript.so'
      }          
}